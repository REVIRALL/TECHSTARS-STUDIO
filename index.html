<!DOCTYPE html>
<html lang="ja">
  <head>
    <!--
      このファイルは Vite のエントリであると同時に、プリレンダリングの雛形でもある。

      <head> の中身（title / description / OGP / JSON-LD 等）は
      ページごとに content/seo.ts が生成し、scripts/prerender.mjs が
      <!== SEO_HEAD ==> の位置へ差し込む。ここに手でメタタグを書き足さないこと。
      事実の変更は content/site.ts に対して行う。
    -->
    <!-- charset / viewport / title を含む <head> の中身は、すべて
         下の <!==SEO_HEAD==> に差し込まれる。ここに重複して書かないこと
         （title が2つあると、検索エンジンは先に出てきた方を採用する） -->
    <!--SEO_HEAD-->

    <!-- Google Fonts。CSSの取得でレンダリングを止めないよう、
         media="print" → onload で all に戻す定番の非同期読み込みにしている。
         JS無効時は <noscript> 側が同期で読み込む -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-black text-white">
    <div id="root"><!--APP_HTML--></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
