[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─────────────────────────────────────────────────────────────
# リダイレクト（上から評価される。順番に意味がある）
# ─────────────────────────────────────────────────────────────

# ★/assets/* は SPA フォールバックより先に 404 へ落とす。
#   これを入れないと、存在しないハッシュ付きJS（古い index.html を掴んだタブ、
#   ロールバック直後など）に対して 200 + index.html が返り、
#   しかも下の immutable が効いて **HTMLを1年間キャッシュ** する。
#   nosniff によりそのHTMLはモジュールとして実行されず、画面は白。
#   immutable なので再読み込みしても直らない。本番で再現を確認している。
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA Routing - fallback to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────
# セキュリティヘッダ
# ─────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    # クリックジャッキング。CSP の frame-ancestors と二重にしている
    # （frame-ancestors がある環境では XFO は無視されるが、古い環境向けに残す）
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

    # ★X-XSS-Protection は 1 ではなく 0 にする。
    #   Chrome/Edge の XSS Auditor は削除済みで、旧実装は「攻撃者が任意のインライン
    #   スクリプトを選択的に無効化できる」副作用が知られている。
    #   「セキュリティヘッダが4本ある」という見かけの安心を作るだけで効果がない。
    X-XSS-Protection = "0"

    Referrer-Policy = "strict-origin-when-cross-origin"

    # Netlify の Force HTTPS でも付くが、リポジトリを読んで有効性が分かるよう明示する。
    # preload は付けない（サブドメインを全部HTTPS化できる確証が取れるまでは解除が困難になる）。
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(self)"

    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # ★CSP。cdn.tailwindcss.com と importmap(esm.sh) を撤去したので script-src は 'self' だけで足りる。
    #   撤去前は第三者CDNが決済リンクを描くページでDOM全権を持っていた（href を書き換えられた）。
    #   style に 'unsafe-inline' が残るのは React の style={{...}} を数箇所使っているため。
    #   script 側には一切付けていない。
    #   connect-src の Google は services/geminiService.ts 用。本番は鍵未設定で現在は発火しない。
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://generativelanguage.googleapis.com; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# ─────────────────────────────────────────────────────────────────────
# キャッシュ
#
# immutable（1年間、再検証なし）を使ってよいのは、
# ファイル名にハッシュが入っていて「中身が変わればURLも変わる」ものだけ。
# Vite が吐く /assets/* がそれに当たる。
#
# 逆に /showcase.css や /img/* はパスが固定なので、immutable にすると
# 中身を差し替えても既訪問者には1年間古いファイルが配られ続ける。
# 実際にこの設定のまま showcase.css を更新してしまっていた。
# ─────────────────────────────────────────────────────────────────────

# ハッシュ付き。URLが変わるので永久キャッシュしてよい
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# パス固定のCSS。差し替えたら即座に反映させたいので毎回再検証する
# （変わっていなければ 304 が返るだけなので、実質ほぼ無料）
[[headers]]
  for = "/showcase.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# パス固定の画像。1日は使い回し、その後は裏で取り直しつつ表示は止めない
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

# SPA のシェル。Netlify の既定と同じだが、誰かが /* に Cache-Control を足したときに
# 静かに反転しないよう明示しておく
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ★"*.jpg" "*.png" のようなパターンは Netlify では "/" 始まりでないとマッチせず、
#   一度も発火していなかった（本番のレスポンスヘッダで確認済み）。
#   綴りを「直す」とハッシュの付かない資産に長期キャッシュが効いてしまうので、
#   ブロックごと置かない。必要なものは上の /img/* と /showcase.css で明示している。

# ─────────────────────────────────────────────────────────────
# 決済の戻り先はインデックスさせない
# ─────────────────────────────────────────────────────────────

# ★robots.txt で Disallow しないこと。クロールを止めると下の noindex が読まれず、
#   URLだけがインデックスに残る（noindex と Disallow の併用は自爆）。
[[headers]]
  for = "/checkout/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
