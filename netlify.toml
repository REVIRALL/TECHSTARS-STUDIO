[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─────────────────────────────────────────────────────────────────────
# ルーティング
#
# 以前は `/* → /index.html 200` の catch-all を置いていた。
# クライアントルーティングをしていないこのサイトでは害しかなく、
# 存在しないURL（/foo, /wp-login.php, 誤ったリンク）がすべて
# 「200 でトップページの中身」を返していた。検索エンジンにはこれが
# ソフト404 かつ大量の重複コンテンツとして見える。
#
# 現在は /pricing/ /faq/ /privacy/ /terms/ /tokushoho/ が実ファイルとして
# 生成されているので、catch-all は不要。未知のURLは 404.html が
# きちんと 404 ステータスで返る。
# ─────────────────────────────────────────────────────────────────────

# 旧オーバーレイのハッシュURLから実ページへ寄せる（外部に貼られていた場合の受け皿）
[[redirects]]
  from = "/company"
  to = "/pricing/"
  status = 301

[[redirects]]
  from = "/tokusho"
  to = "/tokushoho/"
  status = 301

# セキュリティヘッダ
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ─────────────────────────────────────────────────────────────────────
# キャッシュ
#
# immutable（1年間、再検証なし）を使ってよいのは、
# ファイル名にハッシュが入っていて「中身が変わればURLも変わる」ものだけ。
# Vite が吐く /assets/* がそれに当たる。
#
# 逆に /img/* はパスが固定なので、immutable にすると
# 中身を差し替えても既訪問者には1年間古いファイルが配られ続ける。
# ─────────────────────────────────────────────────────────────────────

# ハッシュ付き。URLが変わるので永久キャッシュしてよい
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML には Cache-Control を書かない。
# Netlify の既定が `public, max-age=0, must-revalidate` で、これが正しい。
# ここで `for = "/*.html"` と書いても、リクエストパスは /faq/ であって
# /faq/index.html ではないため、下層ページには当たらない（書くと勘違いを生む）。

# クローラー向けファイル。更新を待たせない
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/plain; charset=utf-8"

# パス固定の画像。1日は使い回し、その後は裏で取り直しつつ表示は止めない
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"
